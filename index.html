<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#1e1e1e;
    padding:30px;
    border-radius:20px;
    text-align:center;
    width:320px;
    box-shadow:0 0 20px rgba(255,255,255,0.1);
}

.profile{
    width:140px;
    height:140px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
}

h1{
    margin-top:15px;
}

p{
    color:#ccc;
}
</style>
</head>
<body>

<div class="card">
    <img src="1.jpeg" class="profile" alt="Foto Profil">
    
    <h1>Luxury Community</h1>
    
    <p>Selamat datang di website resmi Luxury Community.</p>
</div>

</body>
</html>
